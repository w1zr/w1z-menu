name=w1z's menu
version=v1.2.0
description=An in-game mod menu for The Last of Us Part I. Press Insert or F9 (or L3 + R3 on a controller) to open it; navigate with the arrow keys, Enter and Esc, the mouse, or a controller. The game gets no input while the menu is open. PLAYER: God Mode, No Hit Reactions, Infinite Sprint, Undetectable Player, One Hit Kills. CHARACTER: a playable Ellie that really works - play Joel's chapters as Ellie: she moves, aims, shoots and crafts in every chapter, Joel's 9mm grip is correct, and Joel follows her as the AI companion (Replace Campaign Ellie with Joel). Also Play as Joel in Winter, and Swap Now. WEAPONS AND ITEMS: Infinite Ammo with normal reloads, No Reload, infinity sign on the HUD, Infinite Weapon Health, Disable Weapon Sway, Disable Auto Reload / Holster, Drop All Weapons, Give Joel / Ellie / Melee weapons, Give Items and crafting materials, Infinite Crafting and Craftables. INVENTORY: Give All + Upgrades, Give Each Craftable, Parts and Pills x10 / x100, All / No Recipes. CAMERA: Manual Camera, Teleport Player To Camera, Hide HUD. SKINS: change your outfit in-game from Pause > Skins without finishing the story, every skin owned. UNLOCKS: Treasures, Journal Pages, and Chapters / Encounters / Extras while the menu is loaded. SCENE: Replay Current Scene. Plus search, favorites and a status page. Built on the game's own developer-menu functions, found by signature; anything not found is greyed out with the reason. Loads as winmm.dll next to tlou-i.exe. Single-player only; never writes save files itself.
author=w1z
