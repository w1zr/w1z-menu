; w1z's menu - settings. The menu saves changes here automatically.

[Menu]
; Keys that open/close the menu (Windows virtual-key codes, 0 = off).
; 45 = Insert, 120 = F9, 189 = '-'
MenuKey=45
MenuKey2=120
; 1 = L3 + R3 on a controller opens/closes the menu.
ControllerToggle=1
; 1 = pause the game while the menu is open.
PauseWhileOpen=1
; 1 = feature toggles are remembered for the next launch.
RememberToggles=1
; 1 = Play as Ellie / Joel are remembered too (the swap applies when a game loads).
RememberSwap=0
; Menu size in percent (75-200).
Scale=100
; 1 = small on-screen message when a hotkey toggles something.
Notifications=1
Favorites=

[InfiniteAmmo]
; Same keys as the TLOU Infinite Ammo mod.
InfiniteAmmo=1
ShowInfinitySign=1
NoReload=0
; 118 = F7, 119 = F8, 0 = no hotkey
ToggleInfiniteAmmoKey=118
ToggleNoReloadKey=119
BeepOnToggle=1
Logging=1
